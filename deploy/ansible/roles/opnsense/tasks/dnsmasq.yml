    ip: ["10.100.152.13"]
    hardware_addr: e0:d3:62:ba:3d:de

- name: Set DHCP option 43 to UniFi inform URL
  oxlorg.opnsense.dnsmasq_option:
    description: "[Ansible] Option 43 for UniFi inform URL"
    type: set
    option: 43
    value: "01:04:c0:a8:01:02" # suboption 1, length 4, then c0:a8:01:02 = 192.168.1.2
