- name: Configure dnsmasq
  oxlorg.opnsense.dnsmasq_general:
    enabled: true
    port: 53
    dhcp_fqdn: true
    dhcpfirst: true
    domain_needed: true
    forward_private_reverse: false
    regdhcp: true
    regdhcpstatic: true
    resolv_system: true
    strict_order: true

- name: Create LAN dnsmasq DHCP range
  oxlorg.opnsense.dnsmasq_range:
    description: "[Ansible] LAN DHCP range"
    interface: "LAN"
    start_addr: 192.168.1.50
    end_addr: 192.168.1.254
    lease_time: 86400

- name: Create Management dnsmasq DHCP range
  oxlorg.opnsense.dnsmasq_range:
    description: "[Ansible] Management DHCP range"
    interface: "Management"
    start_addr: 10.2.100.2
    end_addr: 10.2.255.254
    lease_time: 86400

- name: Create Homelab dnsmasq DHCP range
  oxlorg.opnsense.dnsmasq_range:
    description: "[Ansible] Homelab DHCP range"
    interface: "Homelab"
    start_addr: 10.10.100.2
    end_addr: 10.10.255.254
    lease_time: 86400

- name: Create Guest dnsmasq DHCP range
  oxlorg.opnsense.dnsmasq_range:
    description: "[Ansible] Guest DHCP range"
    interface: "Guest"
    start_addr: 10.50.0.2
    end_addr: 10.50.0.254
    lease_time: 86400

- name: Create IoT dnsmasq DHCP range
  oxlorg.opnsense.dnsmasq_range:
    description: "[Ansible] IoT DHCP range"
    interface: "IoT"
    start_addr: 10.100.100.1
    end_addr: 10.100.255.254
    lease_time: 86400

- name: Create plex.direct dnsmasq domain
  oxlorg.opnsense.dnsmasq_domain:
    description: "[Ansible] plex.direct"
    sequence: 1
    domain: plex.direct
    ip: 1.1.1.1

- name: Create matrix dnsmasq host
  oxlorg.opnsense.dnsmasq_host:
    description: "[Ansible] matrix host"
    host: matrix
    domain: satan.network
    ip: ["10.10.3.101"]
    hardware_addr: 06:8d:3e:8f:5f:23

- name: Create router dnsmasq host
  oxlorg.opnsense.dnsmasq_host:
    description: "[Ansible] router host"
    host: router
    domain: satan.network
    ip: ["192.168.1.1"]
    hardware_addr: 64:62:66:22:85:18

- name: Create PS5 dnsmasq host
  oxlorg.opnsense.dnsmasq_host:
    description: "[Ansible] PlayStation 5"
    host: ps5
    domain: satan.network
    ip: ["10.100.0.101"]
    hardware_addr: 00:e4:21:15:bd:e8

- name: Create unifi dnsmasq host
  oxlorg.opnsense.dnsmasq_host:
    description: "[Ansible] unifi host"
    host: unifi
    ip: ["192.168.1.2"]
    local: true

- name: Set DHCP option 43 to UniFi inform URL
  oxlorg.opnsense.dnsmasq_option:
    description: "[Ansible] Option 43 for UniFi inform URL"
    type: set
    option: 43
    value: 01043139322E3136382E312E32 # 0143 + `192.168.1.2` hex-encoded
