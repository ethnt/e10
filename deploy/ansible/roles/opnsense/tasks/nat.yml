- name: Create Plex port forward rule (TCP 32400)
  oxlorg.opnsense.nat_destination:
    match_fields: ["description"]
    interface: ["wan"]
    destination_net: "wanip"
    target: "HTPC_Host"
    associated_rule: "pass"
    description: "[Ansible] Plex port forwarding"
    protocol: tcp/udp
    ip_protocol: inet46
    local_port: Plex_Port
    nat_reflection: purenat
    destination_port: Plex_Port
    sequence: 100
    source_net: ""

- name: Create PlayStation 5 port forward rule (TCP 80)
  oxlorg.opnsense.nat_destination:
    match_fields: ["description"]
    interface: ["wan"]
    destination_net: "wanip"
    target: "PS5_MAC"
    associated_rule: "pass"
    description: "[Ansible] PS5 voice/party chat (TCP 80)"
    protocol: TCP
    destination_port: 80

- name: Create PlayStation 5 port forward rule (TCP 443)
  oxlorg.opnsense.nat_destination:
