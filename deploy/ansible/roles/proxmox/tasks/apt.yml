---
- name: Clear legacy /etc/apt/sources.list
  ansible.builtin.copy:
    dest: /etc/apt/sources.list
    content: ""
    mode: "0644"

- name: Remove Ceph repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/ceph.sources
    state: absent

- name: Remove PVE Enterprise repository
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    state: absent

- name: Add Debian repository
  ansible.builtin.deb822_repository:
    name: debian
    types: ["deb", "deb-src"]
    uris: http://deb.debian.org/debian/
    suites: trixie trixie-updates
    components: main contrib non-free-firmware
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg

- name: Add Debian security repository
  ansible.builtin.deb822_repository:
    name: debian-security
    types: ["deb", "deb-src"]
    uris: http://security.debian.org/debian-security/
    suites: trixie-security
    components: main contrib non-free-firmware
    signed_by: /usr/share/keyrings/debian-archive-keyring.gpg

- name: Add Proxmox VE updates repository
  ansible.builtin.deb822_repository:
    name: pve-no-subscription
    types: deb
    uris: http://download.proxmox.com/debian/pve/
    suites: trixie
    components: pve-no-subscription
    signed_by: /usr/share/keyrings/proxmox-archive-keyring.gpg

- name: Update APT repositories
  ansible.builtin.apt:
    update_cache: yes
